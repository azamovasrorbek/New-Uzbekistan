{% load static %}

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro | New Uzbekistan Volunteering</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #00eaff;
            --dark-bg: #ffffff;
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark-bg);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(8, 10, 15, 0.7), rgba(8, 10, 15, 0.85)),
                        url("{% static 'img/b.jpg' %}") no-repeat center center;
            background-size: cover;
            z-index: -1;
        }

        .video-wrapper {
            position: relative;
            width: 90%;
            max-width: 1000px;
            aspect-ratio: 16/9;
            background: #000; /* Video to'liq chiqishi uchun orqa fon qora bo'lgani ma'qul */
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--glass-border);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            /* contain - videoni qirqmasdan to'liq ko'rsatadi */
            object-fit: contain;
        }

        .video-info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        .video-info span {
            background: var(--primary);
            color: #000;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .skip-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
            z-index: 20;
        }

        .skip-btn:hover {
            background: #fff;
            color: #000;
        }

        /* Ovozni yoqish haqida eslatma */
        .mute-warning {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 30px;
            pointer-events: none;
            opacity: 1;
            transition: 0.5s;
            z-index: 5;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="video-wrapper">
        <div class="video-info">
            <span>Intro Video</span>
        </div>

<!--        <div id="muteText" class="mute-warning">-->
<!--            <i class="fas fa-volume-up"></i> Ovozni eshitish uchun bosing-->
<!--        </div>-->

        <video id="introVideo" playsinline poster="{% static 'img/b.jpg' %}" controls>
            <source src="{% static 'video/m.mp4' %}" type="video/mp4">
            Sizning brauzeringiz videoni qo'llab-quvvatlamaydi.
        </video>

        <a href="{% url 'home' %}" class="skip-btn">
            O'tkazib yuborish <i class="fas fa-arrow-right"></i>
        </a>
    </div>

    <script>
        const video = document.getElementById('introVideo');
        const muteText = document.getElementById('muteText');

        // Foydalanuvchi birinchi marta ekranga bossa video boshlanadi va ovoz chiqadi
        document.body.addEventListener('click', function() {
            if (video.paused) {
                video.play();
                video.muted = false; // Ovozni ochish
                muteText.style.opacity = '0'; // Eslatmani yashirish
            }
        }, { once: true });

        // Video tugaganda home sahifasiga o'tish
        video.onended = function() {
            window.location.href = "{% url 'home' %}";
        };
    </script>

</body>
</html>
